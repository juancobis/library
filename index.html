<!doctype html>
<html>
  <head>
    <title>Library</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <title>library</title>
          <path
            d="M12,8A3,3 0 0,0 15,5A3,3 0 0,0 12,2A3,3 0 0,0 9,5A3,3 0 0,0 12,8M12,11.54C9.64,9.35 6.5,8 3,8V19C6.5,19 9.64,20.35 12,22.54C14.36,20.35 17.5,19 21,19V8C17.5,8 14.36,9.35 12,11.54Z"
          />
        </svg>

        <h1>Library</h1>
      </header>

      <main>
        <form>
          <div>
            <label for="input-book-title">Title</label>
            <input
              type="text"
              id="input-book-title"
              placeholder="The Wealth of Nations"
              required
            />
          </div>

          <div>
            <label for="input-book-author">Author</label>
            <input
              type="text"
              id="input-book-author"
              placeholder="Adam Smith"
              required
            />
          </div>

          <div>
            <label for="input-book-year">Year</label>
            <input
              type="number"
              id="input-book-year"
              placeholder="1776"
              required
            />
          </div>

          <div>
            <label for="input-book-pages">№ Pages</label>
            <input
              type="number"
              id="input-book-pages"
              placeholder="230"
              required
            />
          </div>

          <button id="btn-add-book">Add book</button>
        </form>

        <div class="library">
          <h2>My Library</h2>

          <div class="books">
            <div class="card book">
              <h3>The Wealth of Nations</h3>
              <p>Adam Smith</p>
              <p>1776</p>
              <small>50</small>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
